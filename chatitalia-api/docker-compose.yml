services:
  mongo:
    image: mongo:latest
    container_name: chatitalia-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
      MONGO_INITDB_DATABASE: chatitalia
    volumes:
      - ./mongo_data:/data/db
    ports:
      - "27017:27017"

  mongo-express:
    image: mongo-express:latest
    container_name: chatitalia-mongo-express
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: example
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_MONGODB_AUTH_DATABASE: admin
      ME_CONFIG_SITE_BASEURL: /
    ports:
      - "8081:8081"

  redis:
    image: redis:7-alpine
    container_name: chatitalia-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5-community
    container_name: chatitalia-neo4j
    restart: unless-stopped
    environment:
      # Mesma senha default que o código usa (src/infra/neo4j.ts) — não
      # precisa configurar NEO4J_URI/USER/PASSWORD local pra rodar.
      NEO4J_AUTH: neo4j/changeme123
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    ports:
      - "7474:7474" # browser (http://localhost:7474)
      - "7687:7687" # bolt
    volumes:
      - ./neo4j_data:/data
      - ./neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # WAHA: API HTTP do WhatsApp (não oficial, sessão via QR code). Engine NOWEB
  # = sem Chromium, leve. Dashboard pra escanear o QR: http://localhost:3001/dashboard
  waha:
    image: devlikeapro/waha:noweb-arm # Mac Apple Silicon; em x86 use `:noweb`
    container_name: chatitalia-waha
    restart: unless-stopped
    environment:
      WHATSAPP_DEFAULT_ENGINE: NOWEB
      WAHA_API_KEY: ${WAHA_API_KEY:-changeme123}
      WAHA_DASHBOARD_USERNAME: admin
      WAHA_DASHBOARD_PASSWORD: ${WAHA_DASHBOARD_PASSWORD:-changeme123}
      WHATSAPP_SWAGGER_USERNAME: admin
      WHATSAPP_SWAGGER_PASSWORD: ${WAHA_DASHBOARD_PASSWORD:-changeme123}
      # Reabre a sessão sozinho quando o container reinicia.
      WAHA_RESTART_ALL_SESSIONS: "True"
    ports:
      # 3001 no host: a 3000 costuma estar ocupada por outro dev server.
      - "127.0.0.1:3001:3000"
    volumes:
      # Login do WhatsApp (credenciais da sessão) — persiste entre restarts.
      - ./waha_sessions:/app/.sessions
