# Produção na VM: API + Worker + Redis + Neo4j + WAHA. MongoDB fica no Atlas (fora daqui).
# A imagem `chatitalia-api:latest` é buildada na máquina local e enviada
# pela VM via `deploy.sh` (docker save | ssh docker load). Redis, Neo4j e WAHA
# usam a imagem oficial e são baixados direto na VM pelo `docker compose up`.

services:
  api:
    image: ${API_IMAGE:-chatitalia-api:latest}
    container_name: chatitalia-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 8080
      # Bull/Redis: aponta para o serviço `redis` desta rede.
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Neo4j: aponta para o serviço `neo4j` desta rede (banco vetorial do RAG).
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-changeme123}
      # WAHA (WhatsApp): serviço `waha` desta rede. A chave vem do .env.
      # No WAHA, o webhook da sessão é http://api:8080/whatsapp/webhook
      WAHA_URL: http://waha:3000
    ports:
      # Só localhost: o Nginx da VM faz o proxy https -> 8080.
      - "127.0.0.1:8080:8080"
    volumes:
      # PDFs enviados ficam gravados na VM (persistem entre deploys).
      - ./uploads:/app/uploads
    depends_on:
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  # WORKER: mesma imagem da API, outro ponto de entrada (dist/queue/index.js).
  # Processa as filas (lições, avisos de WhatsApp) pra isso não disputar o
  # processo que atende o site. Não tem porta: só consome o Redis.
  worker:
    image: ${API_IMAGE:-chatitalia-api:latest}
    container_name: chatitalia-worker
    restart: unless-stopped
    command: ["node", "dist/queue/index.js"]
    env_file:
      - .env
    environment:
      NODE_ENV: production
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-changeme123}
      # WAHA (WhatsApp): serviço `waha` desta rede. A chave vem do .env.
      WAHA_URL: http://waha:3000
    volumes:
      # Os PDFs das lições são lidos daqui (mesma pasta que a API grava).
      - ./uploads:/app/uploads
    depends_on:
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: chatitalia-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - ./redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5-community
    container_name: chatitalia-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-changeme123}
      # VM pequena: limita a memória do Neo4j pra não brigar com api+redis.
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    ports:
      # Só localhost — a API fala com ele pela rede interna do compose
      # (neo4j:7687). Exponha 7474 publicamente só se precisar do browser web.
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - ./neo4j_data:/data
      - ./neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # WAHA: API HTTP do WhatsApp (não oficial, sessão via QR code). Engine NOWEB
  # = sem Chromium, leve pra VM pequena. A API fala com ele pela rede interna
  # do compose (http://waha:3000, header X-Api-Key).
  waha:
    image: ${WAHA_IMAGE:-devlikeapro/waha:noweb-arm} # VM Ampere (arm64); em AMD use `:noweb`
    container_name: chatitalia-waha
    restart: unless-stopped
    environment:
      WHATSAPP_DEFAULT_ENGINE: NOWEB
      WAHA_API_KEY: ${WAHA_API_KEY:?defina WAHA_API_KEY no .env}
      WAHA_DASHBOARD_USERNAME: admin
      WAHA_DASHBOARD_PASSWORD: ${WAHA_DASHBOARD_PASSWORD:?defina WAHA_DASHBOARD_PASSWORD no .env}
      WHATSAPP_SWAGGER_USERNAME: admin
      WHATSAPP_SWAGGER_PASSWORD: ${WAHA_DASHBOARD_PASSWORD:?defina WAHA_DASHBOARD_PASSWORD no .env}
      # Reabre a sessão sozinho quando o container reinicia.
      WAHA_RESTART_ALL_SESSIONS: "True"
    ports:
      # Só localhost. Pra escanear o QR, abra um túnel SSH:
      #   ssh -L 3001:127.0.0.1:3001 <user>@<vm>  ->  http://localhost:3001/dashboard
      - "127.0.0.1:3001:3000"
    volumes:
      # Login do WhatsApp (credenciais da sessão) — persiste entre deploys.
      - ./waha_sessions:/app/.sessions
